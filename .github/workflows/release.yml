name: Android Signed Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'vX.Y.Z candidate tag; run from main to create it only after signed checks pass'
        type: string
        required: true
        default: 'v0.4.1'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    # Ordinary main commits do not create releases. A dedicated audited commit
    # marker triggers this one-off signed release candidate after CI on the PR.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-signed-rc-v0.4.1]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate candidate tag and Android version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.4.1' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag"; exit 1; }
          actual="$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" app/build.gradle)"
          test "${RELEASE_TAG#v}" = "$actual" || { echo "Release tag and versionName mismatch"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/}" = "$RELEASE_TAG" || { echo "Tag ref mismatch"; exit 1; }
            git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "Tag not present"; exit 1; }
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" || { echo "Tag SHA mismatch"; exit 1; }
          else
            test "$GITHUB_REF" = 'refs/heads/main' || { echo "Candidate must originate from main"; exit 1; }
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" || { echo "Existing tag points to a different commit"; exit 1; }
            fi
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Load permanent signing credentials
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "Missing one or more signing repository secrets"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          test -s "$RUNNER_TEMP/release-keystore.jks"

      - name: Test, lint, sign APK and App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify signatures and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB" | grep -q 'jar verified'
          mkdir -p dist
          cp "$APK" "dist/BudgetTracker-${RELEASE_TAG}.apk"
          cp "$AAB" "dist/BudgetTracker-${RELEASE_TAG}.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budget-tracker-${{ env.RELEASE_TAG }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable tag and publish signed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's partial-ref endpoint can return a nonempty null value for
          # missing tags. Check the exact remote reference instead.
          existing_sha="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk 'NR==1 {print $1}')"
          current_sha="$(git rev-parse HEAD)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$current_sha" ]]; then
            echo "Tag already points to a different commit; refusing to overwrite"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets"
            exit 1
          fi
          # GitHub CLI creates the lightweight tag pointing at the exact tested
          # commit when it doesn't exist yet. No tag is made before verification.
          release_args=(--title "Budget Tracker $RELEASE_TAG (Pre-release)"
            --notes-file docs/RELEASE_NOTES_0.4.1.md --prerelease)
          if [[ -z "$existing_sha" ]]; then
            release_args+=(--target "$current_sha")
          else
            release_args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/* "${release_args[@]}"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"
