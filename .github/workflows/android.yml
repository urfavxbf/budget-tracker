name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ['8.13', '9.6.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Run unit tests, lint and build APK/AAB
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease
      - name: Upload debug APK for internal device smoke tests
        if: matrix.gradle == '8.13'
        uses: actions/upload-artifact@v4
        with:
          name: budget-tracker-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Reproduce CoGo missing AndroidX AAR fallback
        if: matrix.gradle == '9.6.1'
        shell: bash
        run: |
          LOCAL_REPO="$RUNNER_TEMP/cogo-fixtures/localMvnRepository"
          ARTIFACT_DIR="$LOCAL_REPO/androidx/activity/activity/1.8.0"
          mkdir -p "$ARTIFACT_DIR"
          cat > "$ARTIFACT_DIR/activity-1.8.0.pom" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>androidx.activity</groupId>
            <artifactId>activity</artifactId>
            <version>1.8.0</version>
            <packaging>aar</packaging>
          </project>
          POM
          SIMULATED_COGO_MAVEN="$LOCAL_REPO" gradle \
            -I .github/tests/simulate-cogo-repo-init.gradle \
            :app:processDebugNavigationResources

