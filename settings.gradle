pluginManagement {
    // CoGo 26.38+ runs Gradle 9.6.1 and ships AGP 9.3.1 in its offline Maven repo.
    // Preserve AGP 8.7.3 for the existing Gradle 8.9 build.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application' &&
                    org.gradle.util.GradleVersion.current() >= org.gradle.util.GradleVersion.version('9.6')) {
                useVersion('9.3.1')
            }
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "BudgetTracker"
include(":app")
// CoGo injects its bundled local Maven repository at index 0 after settings
// evaluation. Some AndroidX modules in that repository have metadata but not
// their actual AAR. Gradle then sticks to the incomplete local repository and
// never consults Google's complete artifact. Reorder only that injected repo,
// retaining it as the last fallback for IDE-specific/offline dependencies.
gradle.settingsEvaluated { evaluatedSettings ->
    def repositories = evaluatedSettings.dependencyResolutionManagement.repositories
    def cogoRepositories = repositories.findAll { repository ->
        repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                repository.url.scheme == 'file' &&
                repository.url.path.endsWith('/localMvnRepository')
    }
    cogoRepositories.each { repository ->
        repositories.remove(repository)
        repositories.add(repository)
    }
}
