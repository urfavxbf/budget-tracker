image: ghcr.io/cirruslabs/android-sdk:35

stages:
  - test

variables:
  GRADLE_VERSION: "8.9"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "/opt/android-sdk"
  ANDROID_SDK_ROOT: "/opt/android-sdk"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

android_test_and_debug_apk:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip
    - |
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
      if [ -z "$SDKMANAGER" ]; then
        echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
        exit 1
      fi
      yes | "$SDKMANAGER" --licenses >/dev/null || true
      "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
    - curl --fail --silent --show-error --location "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output /tmp/gradle.zip
    - unzip -q /tmp/gradle.zip -d /opt
    - export PATH="/opt/gradle-${GRADLE_VERSION}/bin:$PATH"
    - gradle --version
  script:
    - export PATH="/opt/gradle-${GRADLE_VERSION}/bin:$PATH"
    - gradle testDebugUnitTest assembleDebug
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/testDebugUnitTest/
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/*.xml
